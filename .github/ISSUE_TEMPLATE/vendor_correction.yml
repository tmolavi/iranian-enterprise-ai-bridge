name: "اصلاحیه یا بیانیه رسمی تأمین‌کننده (Vendor Correction)"
description: "ارسال اصلاحیه، مستندات رسمی یا APIهای عمومی توسط شرکت‌های ارائه‌دهنده نرم‌افزار سازمانی"
title: "[Vendor Official]: "
labels: ["vendor-official", "documentation"]
body:
  - type: input
    id: vendor_official_name
    attributes:
      label: نام رسمی شرکت تأمین‌کننده
    validations:
      required: true
  - type: textarea
    id: correction_details
    attributes:
      label: جزئیات اصلاحیه یا مستندات فنی ارائه‌شده
      description: تغییر سطح شواهد از VC/TP به VF به همراه لینک به مستندات یا APIهای در دسترس
    validations:
      required: true
